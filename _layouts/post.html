---
layout: default
---

<style>
/* Announcement page */

.eacap-post {
  max-width: 1068px;
  margin: 58px auto 100px;
}

/* Back link */
.eacap-post-back {
  display: inline-block;
  margin-bottom: 30px;
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
  text-decoration: none !important;
}

.eacap-post-back:hover {
  text-decoration: underline !important;
  text-underline-offset: 4px;
}

/* Main announcement box */
.eacap-post-card {
  border: 1px solid #cbd8cf;
  border-radius: 16px;
  overflow: hidden;
}

/* Pale green header */
.eacap-post-banner {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 32px;
  background: #e9eee9;
  border-bottom: 1px solid #cbd8cf;
}

.eacap-post-banner svg {
  width: 25px;
  height: 25px;
  flex-shrink: 0;
  color: var(--accent);
}

.eacap-post-banner span {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.16em;
  color: var(--accent);
}

/* Content area */
.eacap-post-inner {
  padding: 42px 52px 52px;
}

/* Publication date */
.eacap-post-date {
  display: block;
  margin-bottom: 26px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* Announcement title */
.eacap-post-title {
  margin: 0 0 28px;
  font-family: var(--sans);
  font-size: clamp(28px, 3.2vw, 38px);
  font-weight: 500;
  line-height: 1.3;
  letter-spacing: -0.025em;
  color: var(--foreground);
}

/* Divider */
.eacap-post-divider {
  height: 1px;
  margin-bottom: 32px;
  background: var(--border);
}

/* Body */
.eacap-post-body.prose {
  width: 100%;
  max-width: none;
  text-align: left;
}

.eacap-post-body p,
.eacap-post-body li {
  font-size: 17px;
  line-height: 1.85;
}

.eacap-post-body p {
  margin: 0 0 22px;
}

.eacap-post-body ul {
  margin: 0 0 26px;
  padding-left: 28px;
}

.eacap-post-body a {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* Mobile */
@media (max-width: 750px) {
  .eacap-post {
    margin: 35px auto 70px;
  }

  .eacap-post-back {
    margin-bottom: 22px;
  }

  .eacap-post-banner {
    padding: 17px 20px;
  }

  .eacap-post-inner {
    padding: 28px 22px 34px;
  }
  
.eacap-post-date {
  margin-bottom: 16px;
}
  
  .eacap-post-title {
    font-size: 27px;
    line-height: 1.3;
  }

  .eacap-post-body p,
  .eacap-post-body li {
    font-size: 15px;
    line-height: 1.75;
  }
}
</style>

<article class="eacap-post">

  <a class="eacap-post-back"
     href="{{ '/announcements/' | relative_url }}">
    ← All announcements
  </a>

  <div class="eacap-post-card">

    <div class="eacap-post-banner">

      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.7"
           stroke-linecap="round"
           stroke-linejoin="round"
           aria-hidden="true">
        <path d="M3 10v4h4l9 5V5l-9 5H3Z"/>
        <path d="M7 14l1.5 6h3L10 15.5"/>
        <path d="M20 9l2-2M20 15l2 2M20 12h3"/>
      </svg>

      <span>ANNOUNCEMENT</span>

    </div>

    <div class="eacap-post-inner">

      <time class="eacap-post-date"
            datetime="{{ page.date | date: '%Y-%m-%d' }}">
        {{ page.date | date: '%d %b %Y' }}
      </time>

      <h1 class="eacap-post-title">
        {{ page.title | escape }}
      </h1>

      <div class="eacap-post-divider"></div>

      <div class="eacap-post-body prose">
        {{ content }}
      </div>

    </div>

  </div>

</article>
