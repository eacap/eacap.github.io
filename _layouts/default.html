<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.data.home.brand | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Homepage">{{ site.data.home.brand | escape }}<span class="wordmark-dot">.</span></a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/cfp/' | relative_url }}">CFP</a>
        <a href="{{ '/program/' | relative_url }}">Program</a>
        <a href="{{ '/announcements/' | relative_url }}">News</a>
        <a href="{{ '/archive/' | relative_url }}">Archive</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>
    </header>

    <main id="main-content">{{ content }}</main>

    <footer class="site-footer">
      <span>© {{ 'now' | date: '%Y' }} {{ site.data.home.brand | escape }}.</span>
      <span>{{ site.data.home.full_name | escape }}</span>
    </footer>
  </div>
</body>
</html>
